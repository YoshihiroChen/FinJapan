                            "刚到日本工作时，可以通过工资单和公司人事资料确认自己是否已经加入。"
                        ],
                        calloutTitle: "查看工资单",
                        callout: "如果工资单上出现“厚生年金保険料”，通常说明你正在加入厚生年金。",
                        points: ["公司职员常见", "公司与个人共同负担", "通常从工资扣除"],
                        visual: "employees",
                        source: ["日本年金机构：公的年金制度种类", "https://www.nenkin.go.jp/service/seidozenpan/20140710.html"]
                    },
                    {
                        id: "company-dc",
                        title: "企业 DC",
                        step: "STEP 04",
                        lead: "企业 DC 的正式名称是企业型确定拠出年金。它是公司为员工提供的一种补充养老制度。",
                        paragraphs: [
                            "企业型 DC 的挂金主要由实施该制度的企业承担。员工根据公司提供的商品列表选择如何运用。",
                            "将来能领取多少，取决于投入金额和运用结果。换工作时，资产通常需要按规则转移，避免长时间不处理。",
                            "它与 iDeCo 同属确定拠出年金，但出钱主体、可加入条件和手续不同。是否可以同时使用 iDeCo，需要结合单位制度确认。"
                        ],
                        calloutTitle: "入职时值得问一句",
                        callout: "公司有没有企业 DC？需要自己选商品吗？离职时应该把资产转到哪里？",
                        points: ["公司提供", "员工选择运用商品", "离职时注意资产转移"],
                        visual: "company",
                        source: ["厚生劳动省：确定拠出年金制度概要", "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/nenkin/nenkin/kyoshutsu/gaiyou.html"]
                    },
                    {
                        id: "lump-sum",
                        title: "脱退一时金",
                        step: "STEP 05",
                        lead: "短期在留的外国人离开日本后，如果满足条件，可以申请公的年金的脱退一时金。",
                        paragraphs: [
                            "一般来说，外国籍人士在国民年金缴费期间或厚生年金加入期间达到六个月以上，并且无法领取日本年金时，可以在出国后两年以内提出申请。",
                            "领取脱退一时金后，相应期间将不再作为日本年金加入期间计算。是否申请，应该结合未来是否回到日本、是否可能使用社会保障协定通算期间等因素判断。",
                            "日本年金机构提供中文申请资料和填写示例。准备永久回国时，建议在离日前先确认住民票、银行账户、税务代理人和申请文件等安排。"
                        ],
                        calloutTitle: "不是离日自动退款",
                        callout: "脱退一时金需要主动申请，并且有时间限制。领取前要理解它对未来年金期间计算的影响。",
                        points: ["通常要求加入至少六个月", "出国后两年内申请", "领取后对应期间不再计入"],
                        visual: "lump",
                        source: ["日本年金机构：脱退一时金", "https://www.nenkin.go.jp/international/japanese-system/withdrawalpayment/withdrawalpayment_jp.html"]
                    }
                ]
            }
        ];

        const idecoSection = sections.find(section => section.id === "ideco");
        idecoSection.pages = ["ideco-intro", "ideco-tax", "ideco-suitable", "ideco-return", "ideco-compare"]
            .map(id => idecoSection.pages.find(page => page.id === id));

        const colorClasses = {
            blue: {
                activeBorder: "border-blue-200",
                activeBg: "bg-blue-50",
                circle: "bg-blue-600 text-white",
                text: "text-blue-700",
                paleCircle: "bg-blue-100 text-blue-700",
                line: "border-blue-200"
            },
            purple: {
                activeBorder: "border-purple-200",
                activeBg: "bg-purple-50",
                circle: "bg-purple-600 text-white",
                text: "text-purple-700",
                paleCircle: "bg-purple-100 text-purple-700",
                line: "border-purple-200"
            },
            green: {
                activeBorder: "border-green-200",
                activeBg: "bg-green-50",
                circle: "bg-green-600 text-white",
                text: "text-green-700",
                paleCircle: "bg-green-100 text-green-700",
                line: "border-green-200"
            }
        };

        const flatPages = sections.flatMap(section => section.pages.map(page => ({ ...page, section })));
        let currentId = location.hash.slice(1) || "nisa-intro";

        function getCurrent() {
            return flatPages.find(page => page.id === currentId) || flatPages[0];
        }

        function navigate(id) {
            currentId = id;
            history.replaceState(null, "", `#${id}`);
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function renderSidebar(current) {
            const nav = document.getElementById("sidebar-nav");
            nav.innerHTML = sections.map(section => {
                const active = section.id === current.section.id;
                const colors = colorClasses[section.color];
                return `
                    <div class="min-w-[220px] rounded-xl border ${active ? `${colors.activeBorder} ${colors.activeBg}` : "border-slate-200 bg-white"} p-2">
                        <button type="button" data-target="${section.pages[0].id}" class="w-full flex items-center rounded-lg ${active ? "bg-white shadow-sm" : "hover:bg-slate-50"} px-3 py-3 text-left transition-colors">
                            <span class="flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold ${active ? colors.circle : colors.paleCircle}">${section.number}</span>
                            <span class="ml-3 font-bold ${active ? colors.text : "text-slate-600"}">${section.label}</span>
                        </button>
                        ${active ? `
                            <div class="hidden lg:block ml-7 mt-3 border-l ${colors.line} pl-5 pb-2 space-y-3">
                                ${section.pages.map((page, index) => `
                                    <button type="button" data-target="${page.id}" class="block text-left text-sm ${page.id === current.id ? `font-semibold ${colors.text}` : "text-slate-400 hover:text-slate-600"}">
                                        ${String(index + 1).padStart(2, "0")}　${page.title}
                                    </button>
                                `).join("")}
                            </div>
                        ` : ""}
                    </div>
                `;
            }).join("");
            nav.querySelectorAll("[data-target]").forEach(button => {
                button.addEventListener("click", () => navigate(button.dataset.target));
            });
        }

        function visualMarkup(page) {
            if (page.visual === "cover") {
                return `
                    <div>
                        <img src="https://www.fsa.go.jp/policy/nisa2/book/images/img_2.png" alt="日本金融厅 NISA 早わかり指南封面" class="mx-auto max-h-[calc(100vh-12.5rem)] w-auto rounded-lg shadow-sm">
                        <p class="mt-3 text-center text-xs text-slate-400">图片来源：日本金融厅</p>
                    </div>
                `;
            }
            if (page.visual === "limits-image") {
                return `
                    <div>
                        <img src="https://www.fsa.go.jp/policy/nisa2/know/images/know_img_3.png" alt="日本金融厅：新 NISA 的积立投资枠与成长投资枠对照表" class="mx-auto max-h-[calc(100vh-12.5rem)] max-w-full object-contain rounded-lg shadow-sm">
                        <p class="mt-3 text-center text-xs text-slate-400">图片来源：日本金融厅</p>
                    </div>
                `;
            }
            if (page.visual === "ideco-image") {
                return `
                    <div>
                        <img src="https://www.ideco-koushiki.jp/images/cover_5.png" alt="iDeCo 官方：マンガ・アニメでわかる iDeCo" class="mx-auto max-h-[calc(100vh-12.5rem)] max-w-full object-contain">
                        <p class="mt-3 text-center text-xs text-slate-400">图片来源：iDeCo 官方网站</p>
                    </div>
                `;
            }
            if (page.visual === "ideco-tax-image") {
                return `
                    <div>
                        <img src="https://www.moneypost.jp/wp-content/uploads/2019/11/post1939_P118.jpg" alt="iDeCo 节税额示例表" class="mx-auto max-h-[calc(100vh-12.5rem)] max-w-full object-contain rounded-lg shadow-sm">
                        <p class="mt-3 text-center text-xs text-slate-400">示例图片来源：マネーポストWEB（2019 年）</p>
                    </div>
                `;
            }
            const visualMap = {
                tax: ["免税", "收益留在账户中继续积累", ["投入", "运用", "领取"]],
                limits: ["两种额度", "按自己的节奏逐步投入", ["积立", "成长", "合计"]],
                resident: ["居住条件", "国籍不是唯一判断标准", ["住址", "年龄", "资料"]],
                return: ["离日前确认", "提前处理账户与手续", ["咨询", "提交", "保管"]],
                ideco: ["iDeCo", "为退休生活长期积累", ["投入", "运用", "领取"]],
                decision: ["适合度判断", "先考虑长期规划与流动性", ["留日", "储备", "收入"]],
                compare: ["制度定位", "基础保障与补充养老分开理解", ["公的", "私的", "个人"]],
                layers: ["两层结构", "先理解公的年金基础", ["国民", "厚生", "补充"]],
                national: ["国民年金", "日本公的年金的基础层", ["老龄", "障害", "遗族"]],
                employees: ["厚生年金", "公司职员常见的第二层保障", ["工资", "公司", "个人"]],
                company: ["企业 DC", "公司提供的补充养老制度", ["挂金", "商品", "转移"]],
                lump: ["脱退一时金", "永久离日前值得确认", ["条件", "期限", "影响"]]
            };
            const visual = visualMap[page.visual] || ["入门指南", "一步一步理解制度", ["确认", "比较", "行动"]];
            return `
                <div class="w-full max-w-lg">
                    <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
                        <p class="text-xs font-bold tracking-[0.3em] text-blue-600">GUIDE NOTE</p>
                        <h3 class="mt-4 text-4xl font-bold text-slate-900">${visual[0]}</h3>
                        <p class="mt-3 text-lg leading-8 text-slate-500">${visual[1]}</p>
                        <div class="mt-10 space-y-4">
                            ${visual[2].map((item, index) => `
                                <div class="flex items-center">
                                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-blue-700">${index + 1}</span>
                                    <div class="ml-4 h-2 flex-1 overflow-hidden rounded-full bg-slate-100">
                                        <div class="h-full rounded-full bg-blue-${index === 0 ? "600" : index === 1 ? "400" : "300"}" style="width:${88 - index * 15}%"></div>
                                    </div>
                                    <span class="ml-4 w-12 text-sm font-semibold text-slate-600">${item}</span>
                                </div>
                            `).join("")}
                        </div>
                    </div>
                    <p class="mt-4 text-center text-xs text-slate-400">图片区域 · 后续可替换为插图</p>
                </div>
            `;
        }

        function renderArticle(current) {
            const index = flatPages.findIndex(page => page.id === current.id);
            const previous = flatPages[index - 1];
            const next = flatPages[index + 1];
            const sectionIndex = current.section.pages.findIndex(page => page.id === current.id);

            document.title = `${current.title}｜在日华人理财指南`;
            document.getElementById("breadcrumb").innerHTML = `
                <span>${current.section.label} 专区</span>
                <svg class="mx-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                <span class="text-blue-600">${String(sectionIndex + 1).padStart(2, "0")} ${current.title}</span>
            `;
            document.getElementById("visual-panel").innerHTML = visualMarkup(current);

            const nameNote = current.nameNote ? `
                <div class="mt-5 rounded-xl border border-slate-200 bg-slate-50 p-5">
                    <p class="text-sm font-bold text-slate-700">为什么叫 NISA？</p>
                    <p class="mt-2 text-sm leading-6 text-slate-600">
                        英国原本有一种个人储蓄账户，叫 <strong class="font-semibold text-slate-800">ISA（Individual Savings Account）</strong>。
                        日本参考了这项制度，并在前面加上代表日本的 “N”，因此称为
                        <strong class="font-semibold text-slate-800">NISA（Nippon Individual Savings Account）</strong>。
                    </p>
                </div>
            ` : "";

            const stats = current.stats ? `
                <div class="mt-5 grid gap-3 sm:grid-cols-3">
                    ${current.stats.map(stat => `
                        <div class="rounded-lg border border-slate-200 p-3">
                            <p class="text-lg font-bold text-blue-700">${stat[0]}</p>
                            <p class="mt-1 text-xs leading-5 text-slate-500">${stat[1]}</p>
                        </div>
                    `).join("")}
                </div>
            ` : "";

            const points = current.points ? `
                <div class="mt-5 grid gap-3 sm:grid-cols-3">
                    ${current.points.map((point, index) => `
                        <div class="rounded-lg border border-slate-200 p-3">
                            <p class="text-xs font-bold text-blue-600">POINT ${String(index + 1).padStart(2, "0")}</p>
                            <p class="mt-1 text-sm leading-6 text-slate-600">${point}</p>
                        </div>
                    `).join("")}
                </div>
            ` : "";

            const articlePanel = document.getElementById("article-panel");
            articlePanel.innerHTML = `
                <p class="text-sm font-bold tracking-widest text-blue-600">STEP ${String(sectionIndex + 1).padStart(2, "0")}</p>
                <h2 class="mt-3 text-3xl font-bold sm:text-4xl">${current.title}</h2>
                <p class="mt-6 text-base leading-8 text-slate-600">${current.lead}</p>
                ${current.paragraphs.map(paragraph => `<p class="mt-4 text-base leading-8 text-slate-600">${paragraph}</p>`).join("")}
                ${nameNote}
                <div class="mt-5 rounded-xl border border-blue-100 bg-blue-50 p-5">
                    <p class="text-sm font-bold text-blue-700">${current.calloutTitle}</p>
                    <p class="mt-2 leading-7 text-blue-950">${current.callout}</p>
                </div>
                ${stats}
                ${points}
                <div class="mt-6 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-5">
                    ${previous ? `<button type="button" data-target="${previous.id}" class="inline-flex items-center rounded-lg border border-slate-200 px-4 py-3 text-sm font-bold text-slate-600 hover:bg-slate-50">← 上一步</button>` : `<span></span>`}
                    ${next ? `<button type="button" data-target="${next.id}" class="inline-flex items-center rounded-lg bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-700">下一步：${next.title} →</button>` : `<button type="button" data-target="nisa-intro" class="inline-flex items-center rounded-lg bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-700">回到开头 →</button>`}
                </div>
                <p class="mt-5 text-xs leading-5 text-slate-400">
                    官方参考：<a href="${current.source[1]}" target="_blank" rel="noreferrer" class="text-blue-600 hover:underline">${current.source[0]}</a>
                </p>
            `;
            articlePanel.scrollTop = 0;
            document.querySelectorAll("#article-panel [data-target]").forEach(button => {
                button.addEventListener("click", () => navigate(button.dataset.target));
            });

            document.getElementById("progress-bar").style.width = `${((index + 1) / flatPages.length) * 100}%`;
            document.getElementById("progress-text").textContent = `${current.section.label} 专区 · ${sectionIndex + 1} / ${current.section.pages.length}`;
        }

        function render() {
            const current = getCurrent();
            currentId = current.id;
            renderSidebar(current);
            renderArticle(current);
        }

        window.addEventListener("hashchange", () => {
            currentId = location.hash.slice(1) || "nisa-intro";
            render();
        });

        render();
    </script>
</body>
</html>
