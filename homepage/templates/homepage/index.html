{% load static %}

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在日华人理财指南</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
        }

        .site-mark::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #ffffff;
            display: block;
        }

        .guide-card {
            position: relative;
            overflow: hidden;
            min-height: 256px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .guide-card:hover {
            transform: translateY(-2px);
            background-color: #ffffff;
        }

        .guide-card::after {
            content: attr(data-label);
            position: absolute;
            top: 14px;
            right: 24px;
            color: rgba(120, 116, 109, 0.08);
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1;
            pointer-events: none;
        }

        .guide-arrow {
            position: absolute;
            left: 34px;
            bottom: 34px;
            color: #a6a19a;
            font-size: 26px;
            line-height: 1;
        }

        a:focus-visible {
            outline: 2px solid #8f8980;
            outline-offset: 4px;
        }
    </style>
</head>

<body class="min-h-screen bg-[#f4f3f1] text-[#292826]">

<header class="border-b border-[#e5e2dd] bg-[#fbfaf8]">
    <div class="mx-auto flex h-[62px] max-w-5xl items-center justify-between px-6">
        <a href="/" class="flex items-center gap-3">
            <span class="site-mark flex h-6 w-6 items-center justify-center rounded-lg bg-[#aaa6a0]"></span>
            <span class="text-base font-semibold text-[#202020]">在日华人理财指南</span>
        </a>

        <nav class="hidden items-center gap-9 text-sm font-medium text-[#373532] md:flex">
            <a class="hover:text-black" href="/investment-system/">NISA</a>
            <a class="hover:text-black" href="/securities-bank/">开户</a>
            <a class="hover:text-black" href="/investment/">投资</a>
            <a class="hover:text-black" href="/tax/">税务</a>
        </nav>
    </div>
</header>

<main class="mx-auto max-w-5xl px-6 pb-20 pt-16 md:pt-20">
    <section class="mx-auto max-w-3xl text-center">
        <h1 class="text-3xl font-bold leading-tight text-[#2b2a28] md:text-[38px]">
            日本理财从零到一全攻略
        </h1>

        <p class="mx-auto mt-6 max-w-[620px] text-[15px] leading-8 text-[#77736d]">
            攻略分成四个板块：NISA、开户、投资和税务。
        </p>

        <div class="mx-auto mt-8 flex w-24 items-center justify-center gap-2 text-[#b9b4ad]">
            <span class="h-1 w-1 rounded-full bg-current"></span>
            <span class="h-px w-14 bg-current"></span>
            <span class="h-1 w-1 rounded-full bg-current"></span>
        </div>
    </section>

    <section class="mx-auto mt-14 grid max-w-[890px] grid-cols-1 gap-5 md:grid-cols-2">
        <a
            href="/investment-system/"
            class="guide-card rounded-xl bg-[#eef0f7] p-9"
            data-label="nisa"
        >
            <h2 class="relative z-10 text-[22px] font-bold text-[#2b2a28]">
                NISA・iDeCo・年金
            </h2>
            <p class="relative z-10 mt-2 text-sm text-[#77736d]">
                日本免税与养老体系
            </p>
            <span class="guide-arrow">→</span>
        </a>

        <a
            href="/securities-bank/"
            class="guide-card rounded-xl bg-[#eff4ef] p-9"
            data-label="开户"
        >
            <h2 class="relative z-10 text-[22px] font-bold text-[#2b2a28]">
                在日开户全攻略
            </h2>
            <p class="relative z-10 mt-2 text-sm text-[#77736d]">
                券商・银行・支付工具
            </p>
            <span class="guide-arrow">→</span>
        </a>

        <a
            href="/investment/"
            class="guide-card rounded-xl bg-[#f2f1ed] p-9"
            data-label="投资"
        >
            <h2 class="relative z-10 text-[22px] font-bold text-[#2b2a28]">
                日本投资入门
            </h2>
            <p class="relative z-10 mt-2 text-sm text-[#77736d]">
                股票・ETF・黄金・加密
            </p>
            <span class="guide-arrow">→</span>
        </a>

        <a
            href="/tax/"
            class="guide-card rounded-xl bg-[#f7efec] p-9"
            data-label="税务"
        >
            <h2 class="relative z-10 text-[22px] font-bold text-[#2b2a28]">
                日本税务基础
            </h2>
            <p class="relative z-10 mt-2 text-sm text-[#77736d]">
                避坑指南与申报规则
            </p>
            <span class="guide-arrow">→</span>
        </a>
    </section>
</main>


</body>

</html>
